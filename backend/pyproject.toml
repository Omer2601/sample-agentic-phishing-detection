[project]
name = "phish-backend"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = ["phish-contracts", "boto3==1.43.105", "idna==3.20", "pydantic==2.13.5"]

[tool.uv.sources]
phish-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest==9.1.1", "moto[dynamodb,s3,sqs]==5.2.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phish_backend"]
