[project]
name = "phish-contracts"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = ["pydantic==2.13.5"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phish_contracts"]
